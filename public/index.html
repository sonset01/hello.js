<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Week 2 API</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { color: #d62839; }
    code { background: #f2f2f2; padding: 2px 6px; border-radius: 4px; }
    li { margin: 8px 0; }
  </style>
</head>
<body>
  <h1>My Week 2 API!</h1>
  <p>A simple Express API built for the BeTechified Backend Development assignment.</p>
  <h2>Endpoints</h2>
  <ul>
    <li><code>GET /</code> – welcome message</li>
    <li><code>POST /user</code> – body <code>{"name": "...", "email": "..."}</code> returns "Hello, [name]!"</li>
    <li><code>GET /user/:id</code> – returns "User [id] profile"</li>
  </ul>
</body>
